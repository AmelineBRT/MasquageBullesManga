name: MangaLensFR debug APK

on:
  push:
    branches: ["release/v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Read app version
        id: version
        run: |
          version="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read app version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "MangaLensFR-${{ steps.version.outputs.version }}-debug.apk"
          sha256sum "MangaLensFR-${{ steps.version.outputs.version }}-debug.apk" > checksums.txt

      - name: Publish debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-v${{ steps.version.outputs.version }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag"             "MangaLensFR-${{ steps.version.outputs.version }}-debug.apk"             checksums.txt             --target "$GITHUB_SHA"             --title "MangaLensFR ${{ steps.version.outputs.version }} — APK test"             --notes "APK de test du fork MangaLensFR, signé avec la clé debug publique du projet. Il peut mettre à jour une installation MangaLensFR déjà signée avec cette même clé debug. Il ne remplace pas une version officielle MangaLens signée avec la clé privée de mkisontop/MangaLens."
